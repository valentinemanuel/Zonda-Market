openapi: 3.1.0
info:
  title: API de Zonda Market
  version: 0.1.0
  description: Diagnóstico, catálogo, identidad, publicaciones de vendedor, carrito, checkout y reservas.
security: []
paths:
  /api/v1/status:
    get:
      summary: Consultar diagnóstico de la API
      responses:
        '200':
          description: Estado y versión del build
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    const: UP
                  version:
                    type: string
  /api/v1/categories:
    get:
      summary: Consultar el árbol público de categorías
      responses:
        '200':
          description: Categorías raíz con sus descendientes vigentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNode'
  /api/v1/categories/{id}:
    get:
      summary: Consultar una categoría activa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          example: e0020000-0000-4000-8000-000000000001
      responses:
        '200':
          description: Categoría visible
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: UUID inválido. Código INVALID_REQUEST.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '404':
          description: Categoría ausente o archivada. Código CATEGORY_NOT_FOUND.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/auth/register:
    post:
      summary: Crear cuenta con rol USER e iniciar sesión
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Acceso en JSON y refresh en cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Datos inválidos (INVALID_REQUEST).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '403':
          description: Origin o cabecera CSRF inválidos (CSRF_REJECTED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '409':
          description: Correo registrado (EMAIL_IN_USE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión con correo y contraseña
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Acceso en JSON y refresh en cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Datos inválidos (INVALID_REQUEST).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '401':
          description: Credenciales inválidas (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '403':
          description: Origin o cabecera CSRF inválidos (CSRF_REJECTED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/auth/refresh:
    post:
      summary: Renovar el acceso y rotar la cookie
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          description: Acceso en JSON y refresh en cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Sesión inválida, vencida o reutilizada (INVALID_SESSION). Se elimina la cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '403':
          description: Origin o cabecera CSRF inválidos (CSRF_REJECTED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/auth/logout:
    post:
      summary: Revocar la familia actual y eliminar la cookie
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '204':
          description: Sesión cerrada. La operación es 204 también si la sesión ya terminó.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
        '403':
          description: Origin o cabecera CSRF inválidos (CSRF_REJECTED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/me:
    get:
      summary: Consultar la cuenta asociada al Bearer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cuenta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Bearer ausente, alterado, vencido o revocado (INVALID_SESSION).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    patch:
      summary: Actualizar el nombre de la cuenta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Cuenta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
  /api/v1/me/addresses:
    get:
      summary: Listar mis direcciones activas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de direcciones de la cuenta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/InvalidSession'
    post:
      summary: Guardar una dirección en Argentina
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Dirección guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
  /api/v1/me/addresses/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Actualizar los campos enviados de mi dirección
      description: Los campos omitidos o con valor null conservan el dato previo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressPatch'
      responses:
        '200':
          description: Dirección actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '404':
          $ref: '#/components/responses/AddressNotFound'
    delete:
      summary: Dar de baja mi dirección
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Dirección dada de baja.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '404':
          $ref: '#/components/responses/AddressNotFound'
  /api/v1/me/seller-profile:
    get:
      summary: Consultar mi perfil de vendedor activo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del vendedor autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfileResponse'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '404':
          $ref: '#/components/responses/SellerNotFound'
    post:
      summary: Activar mi perfil de vendedor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerActivationRequest'
      responses:
        '201':
          description: Perfil de vendedor creado y rol actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerActivationForbidden'
        '409':
          $ref: '#/components/responses/SellerActivationConflict'
  /api/v1/sellers/{slug}:
    get:
      summary: Consultar ficha pública y reputación inicial
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 50
            pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      responses:
        '200':
          description: Ficha pública del vendedor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProfileResponse'
        '404':
          $ref: '#/components/responses/SellerNotFound'
  /oauth2/authorization/google:
    get:
      summary: Iniciar autorización con Google
      responses:
        '302':
          description: Redirige a Google con PKCE S256 y emite la cookie de correlación. Si Google no está habilitado para este host, redirige al retorno de Zonda con un error.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              $ref: '#/components/headers/GoogleBrowserCookie'
  /login/oauth2/code/google:
    get:
      summary: Recibir el retorno OIDC de Google
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: 'Redirige a /oauth/retorno. El fragmento contiene un código efímero de Zonda o un error. La cookie de correlación sigue vigente durante un minuto para el intercambio exitoso.'
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              $ref: '#/components/headers/GoogleBrowserCookie'
  /api/v1/auth/email-verification/request:
    post:
      summary: Solicitar enlace de verificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLinkRequest'
      responses:
        '202':
          $ref: '#/components/responses/EmailLinkAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/auth/email-verification/confirm:
    post:
      summary: Confirmar correo con un enlace de un solo uso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmation'
      responses:
        '204':
          description: Correo verificado.
        '400':
          $ref: '#/components/responses/InvalidEmailLink'
        '429':
          $ref: '#/components/responses/EmailLinkRateLimit'
  /api/v1/auth/password-reset/request:
    post:
      summary: Solicitar enlace de recuperación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLinkRequest'
      responses:
        '202':
          $ref: '#/components/responses/EmailLinkAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/auth/password-reset/confirm:
    post:
      summary: Restablecer contraseña y revocar las sesiones de la cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
      responses:
        '204':
          description: Contraseña actualizada y sesiones anteriores revocadas.
        '400':
          $ref: '#/components/responses/InvalidEmailLink'
        '429':
          $ref: '#/components/responses/EmailLinkRateLimit'
  /api/v1/auth/oauth/google:
    get:
      summary: Indicar si Google está habilitado para el host web
      responses:
        '200':
          description: Disponibilidad de Google en este origen.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
  /api/v1/auth/oauth/exchange:
    post:
      summary: Canjear el código efímero del retorno de Google
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/GoogleBrowserCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: Acceso en JSON, refresh en cookie y eliminación de la cookie de correlación.
          headers:
            Set-Cookie:
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Código vencido, reutilizado o inválido para este navegador (GOOGLE_EXCHANGE_INVALID). Para vincular, también se exige la sesión que autorizó la operación (INVALID_SESSION).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          description: Correo ya registrado (GOOGLE_LINK_REQUIRED), correo diferente al vincular (GOOGLE_EMAIL_MISMATCH) o identidad ya vinculada (GOOGLE_IDENTITY_CONFLICT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '503':
          $ref: '#/components/responses/GoogleUnavailable'
  /api/v1/me/identities/google:
    get:
      summary: Consultar la vinculación de Google de la cuenta autenticada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado de vinculación.
          content:
            application/json:
              schema:
                type: object
                required: [linked]
                properties:
                  linked:
                    type: boolean
        '401':
          $ref: '#/components/responses/InvalidSession'
  /api/v1/me/identities/google/start:
    post:
      summary: Autorizar la vinculación de Google con la contraseña actual
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/RefreshCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  maxLength: 72
      responses:
        '200':
          description: URL de Google y cookie de correlación. La vinculación requiere completar el retorno con la sesión actual.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/GoogleBrowserCookie'
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Sesión ausente o revocada (INVALID_SESSION) o contraseña incorrecta (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '503':
          $ref: '#/components/responses/GoogleUnavailable'
  /api/v1/seller/listing-categories:
    get:
      summary: Listar categorías finales y sus esquemas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
  /api/v1/seller/listings:
    get:
      summary: Listar mis publicaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingSummary'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
    post:
      summary: Crear un borrador privado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationRequest'
      responses:
        '201':
          description: Recurso privado creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
  /api/v1/seller/listings/{id}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      summary: Consultar mi publicación y sus variantes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
    patch:
      summary: Editar mi publicación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationPatch'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '409':
          $ref: '#/components/responses/ListingConflict'
  /api/v1/seller/listings/{id}/skus:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      summary: Agregar una variante a mi publicación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuRequest'
      responses:
        '201':
          description: Recurso privado creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuResponse'
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '409':
          $ref: '#/components/responses/ListingConflict'
  /api/v1/seller/listings/{id}/skus/{skuId}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
      - $ref: '#/components/parameters/SkuId'
    patch:
      summary: Editar atributos o precio de mi variante
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuPatch'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuResponse'
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '409':
          $ref: '#/components/responses/ListingConflict'
  /api/v1/listings:
    get:
      summary: Buscar publicaciones visibles
      description: La búsqueda en español abarca título y descripción. Los filtros de variante se aplican al mismo SKU.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
        - name: category
          in: query
          description: UUID de una categoría o de la rama que la contiene.
          schema: { type: string, format: uuid }
        - name: min
          in: query
          description: Precio mínimo inclusivo en ARS.
          schema: { type: number, minimum: 0, multipleOf: 0.01 }
        - name: max
          in: query
          description: Precio máximo inclusivo en ARS.
          schema: { type: number, minimum: 0, multipleOf: 0.01 }
        - name: seller
          in: query
          description: Identificador público del vendedor.
          schema: { type: string, maxLength: 50 }
        - name: attr
          in: query
          description: 'Un valor por atributo en el formato nombre:valor. Repetir el parámetro para combinar atributos.'
          style: form
          explode: true
          schema:
            type: array
            maxItems: 16
            items: { type: string, maxLength: 241 }
          example: ['color:Azul', 'talle:M']
        - name: inStock
          in: query
          description: True pide variantes disponibles y false pide variantes agotadas.
          schema: { type: boolean }
        - $ref: '#/components/parameters/CatalogPage'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, newest, price_asc, price_desc], default: relevance }
      responses:
        '200':
          description: Página de publicaciones y facetas del conjunto filtrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingSearchPage'
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
  /api/v1/listings/{id}/questions:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      summary: Leer las preguntas de una publicación visible
      parameters:
        - $ref: '#/components/parameters/CatalogPage'
        - $ref: '#/components/parameters/QuestionPageSize'
      responses:
        '200':
          description: Página de preguntas y respuestas públicas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/QuestionPage'
                  - properties:
                      content:
                        items: { $ref: '#/components/schemas/PublicQuestion' }
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
    post:
      summary: Publicar una pregunta desde una cuenta autenticada
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          $ref: '#/components/responses/QuestionWritten'
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '429':
          $ref: '#/components/responses/QuestionRateLimit'
  /api/v1/seller/questions:
    get:
      summary: Listar preguntas pendientes de mis publicaciones visibles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CatalogPage'
        - $ref: '#/components/parameters/QuestionPageSize'
      responses:
        '200':
          description: Página de preguntas pendientes, de la más antigua a la más reciente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/QuestionPage'
                  - properties:
                      content:
                        items: { $ref: '#/components/schemas/PendingQuestion' }
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
  /api/v1/seller/questions/{id}/answer:
    put:
      summary: Responder una pregunta de una publicación propia
      description: Repetir el mismo texto devuelve la respuesta guardada.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          $ref: '#/components/responses/QuestionWritten'
        '400':
          $ref: '#/components/responses/InvalidCatalogRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '404':
          description: Pregunta ausente, ajena o de una publicación inactiva. Código QUESTION_NOT_FOUND.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemResponse' }
        '409':
          description: Ya existe otro texto de respuesta. Código QUESTION_ALREADY_ANSWERED.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemResponse' }
        '429':
          $ref: '#/components/responses/QuestionRateLimit'
  /api/v1/listings/{slug}:
    parameters:
      - $ref: '#/components/parameters/ListingSlug'
    get:
      summary: Consultar una publicación visible por slug
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetailResponse'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
  /api/v1/seller/listings/{id}/images:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      summary: Adjuntar una imagen a mi publicación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingImageUpload'
      responses:
        '201':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingImageResponse'
        '400':
          $ref: '#/components/responses/InvalidListingMediaRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '409':
          $ref: '#/components/responses/ListingMediaConflict'
        '413':
          $ref: '#/components/responses/ListingImageTooLarge'
        '503':
          $ref: '#/components/responses/ListingMediaUnavailable'
  /api/v1/seller/listings/{id}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
      - $ref: '#/components/parameters/ImageId'
    patch:
      summary: Editar texto alternativo u ordenar una imagen
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingImagePatch'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingImageResponse'
        '400':
          $ref: '#/components/responses/InvalidListingMediaRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
    delete:
      summary: Retirar una imagen y encolar el borrado
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Imagen retirada. El borrado en el proveedor se procesa en segundo plano.
        '400':
          $ref: '#/components/responses/InvalidListingMediaRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '409':
          $ref: '#/components/responses/ListingMediaConflict'
  /api/v1/seller/listings/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      summary: Publicar o volver a publicar mi ficha
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          $ref: '#/components/responses/InvalidListingMediaRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '409':
          $ref: '#/components/responses/ListingMediaConflict'
  /api/v1/seller/listings/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    post:
      summary: Archivar mi publicación
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          $ref: '#/components/responses/InvalidListingMediaRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '409':
          $ref: '#/components/responses/ListingMediaConflict'
  /api/v1/seller/skus/{id}/stock-adjustments:
    parameters:
      - $ref: '#/components/parameters/SkuPathId'
    post:
      summary: Ajustar el stock disponible de un SKU propio
      description: Una clave repetida con los mismos datos devuelve el movimiento original. El motivo se compara sin espacios exteriores.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '200':
          description: Movimiento persistido o recuperado mediante su clave.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovement'
        '400':
          $ref: '#/components/responses/InvalidStockRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
        '409':
          $ref: '#/components/responses/StockConflict'
  /api/v1/seller/skus/{id}/stock-movements:
    parameters:
      - $ref: '#/components/parameters/SkuPathId'
    get:
      summary: Consultar el historial de stock de un SKU propio
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Página de movimientos del más nuevo al más antiguo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementPage'
        '400':
          $ref: '#/components/responses/InvalidStockRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/SellerRequired'
        '404':
          $ref: '#/components/responses/ListingResourceNotFound'
  /api/v1/cart:
    get:
      summary: Cotizar el carrito de la cuenta con precios y disponibilidad vigentes
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/CartQuote'
        '401':
          $ref: '#/components/responses/InvalidSession'
  /api/v1/cart/items/{skuId}:
    parameters:
      - name: skuId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Establecer la cantidad de una variante en el carrito propio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/CartQuote'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '404':
          description: Variante inexistente o retirada (SKU_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '409':
          description: CART_VERSION_CONFLICT, CART_ITEM_RESERVED, INSUFFICIENT_STOCK o SELF_PURCHASE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
    delete:
      summary: Quitar una variante del carrito propio, incluso si quedó no disponible
      security:
        - bearerAuth: []
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          $ref: '#/components/responses/CartQuote'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '404':
          description: La línea no pertenece al carrito actual (CART_ITEM_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '409':
          description: Versión obsoleta (CART_VERSION_CONFLICT) o línea reservada (CART_ITEM_RESERVED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
  /api/v1/checkout/quote:
    post:
      summary: Crear una cotización vigente por cinco minutos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Cotización para la dirección y versión seleccionadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/CheckoutEmailRequired'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '409':
          $ref: '#/components/responses/CheckoutConflict'
  /api/v1/checkout/confirm:
    post:
      summary: Congelar la orden de una cotización propia y reservar todos sus SKU
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Clave por cuenta. Repetir con el mismo quoteId recupera la orden original.
          schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutConfirmRequest'
      responses:
        '200':
          $ref: '#/components/responses/CheckoutOrder'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/CheckoutEmailRequired'
        '404':
          description: Cotización ajena o inexistente (QUOTE_NOT_FOUND) o dirección retirada (ADDRESS_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '409':
          $ref: '#/components/responses/CheckoutConflict'
  /api/v1/orders:
    get:
      summary: Listar las órdenes propias, más recientes primero
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Página de órdenes propias con estado persistido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
  /api/v1/orders/active:
    get:
      summary: Recuperar la orden activa de la cuenta
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/CheckoutOrder'
        '204':
          description: La cuenta no tiene una orden activa.
        '401':
          $ref: '#/components/responses/InvalidSession'
  /api/v1/orders/{id}:
    get:
      summary: Consultar el detalle congelado y materializar el vencimiento de una orden propia
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/CheckoutOrder'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '404':
          description: La orden no existe o pertenece a otra cuenta (ORDER_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CatalogPage:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    QuestionPageSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 48, default: 10 }
    SkuPathId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ListingSlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        maxLength: 200
    ImageId:
      in: path
      name: imageId
      required: true
      schema:
        type: string
        format: uuid
    ListingId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    SkuId:
      in: path
      name: skuId
      required: true
      schema:
        type: string
        format: uuid
    GoogleBrowserCookie:
      name: __Host-zonda-oauth
      in: cookie
      required: true
      description: Correlación del acceso con Google con el navegador que inició el proceso.
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: true
      description: Origen exacto de la aplicación web habilitado en el servidor.
      schema:
        type: string
    Csrf:
      name: X-Zonda-CSRF
      in: header
      required: true
      schema:
        type: string
        const: '1'
    RefreshCookie:
      name: __Host-zonda-refresh
      in: cookie
      description: JWT de renovación. Si falta, refresh devuelve 401 y logout devuelve 204.
      schema:
        type: string
  responses:
    CheckoutOrder:
      description: Orden propia con subórdenes congeladas y un plazo de reserva de 15 minutos.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'
    CheckoutEmailRequired:
      description: La cuenta requiere verificación de correo (EMAIL_NOT_VERIFIED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    CheckoutConflict:
      description: CART_EMPTY, CART_VERSION_CONFLICT, STOCK_CHANGED, QUOTE_EXPIRED, QUOTE_CHANGED, QUOTE_ALREADY_CONFIRMED, ORDER_ALREADY_ACTIVE, CHECKOUT_EXPIRED, CHECKOUT_TOTAL_LIMIT o IDEMPOTENCY_KEY_REUSED.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    CartQuote:
      description: Estado del carrito propio en ARS. Los productos no elegibles quedan fuera de los subtotales y del total.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CartResponse'
    QuestionWritten:
      description: Mensaje guardado como texto plano.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicQuestion' }
    QuestionRateLimit:
      description: Presupuesto de la cuenta agotado en esta hora UTC. Código QUESTION_RATE_LIMIT.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemResponse' }
    InvalidStockRequest:
      description: Parámetros inválidos (INVALID_REQUEST) o ajuste sin cambio o motivo válido (STOCK_ADJUSTMENT_INVALID).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    StockConflict:
      description: Versión obsoleta, clave reutilizada con otros datos o saldo fuera de rango (VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, INSUFFICIENT_STOCK o STOCK_LIMIT_EXCEEDED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    InvalidListingMediaRequest:
      description: Datos inválidos (INVALID_REQUEST, IMAGE_INVALID, IMAGE_DIMENSIONS_INVALID, IMAGE_ALT_INVALID o IMAGE_POSITION_INVALID).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    ListingMediaConflict:
      description: Operación incompatible con el estado o los límites (IMAGE_LIMIT_REACHED, IMAGE_REQUIRED, LISTING_INCOMPLETE o LISTING_NOT_ACTIVE).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    ListingImageTooLarge:
      description: El archivo supera 5 MiB (IMAGE_TOO_LARGE). El proxy también puede responder 413 ante un cuerpo superior a 6 MiB.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    ListingMediaUnavailable:
      description: El proveedor o la validación están temporalmente indisponibles (MEDIA_UNAVAILABLE o IMAGE_VALIDATION_BUSY).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    InvalidCatalogRequest:
      description: Datos inválidos (INVALID_REQUEST, CATEGORY_NOT_LEAF, LISTING_TEXT_INVALID, SPECS_TOO_LARGE, SPECS_INVALID o SKU_ATTRIBUTES_INVALID).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    SellerRequired:
      description: La cuenta necesita un perfil vendedor habilitado (SELLER_REQUIRED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    ListingResourceNotFound:
      description: Publicación, variante o imagen ausente, ajena o no visible en la ficha pública (LISTING_NOT_FOUND, SKU_NOT_FOUND o IMAGE_NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    ListingConflict:
      description: Versión obsoleta, nueva categoría incompatible o duplicado (VERSION_CONFLICT, CATEGORY_SKUS_INCOMPATIBLE, SKU_CODE_IN_USE o SKU_COMBINATION_IN_USE).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    AddressNotFound:
      description: Dirección ausente, dada de baja o de otra cuenta (ADDRESS_NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    SellerNotFound:
      description: Perfil vendedor activo ausente (SELLER_NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    SellerActivationForbidden:
      description: Correo pendiente (EMAIL_NOT_VERIFIED) o rol sin acceso a la activación (SELLER_ACTIVATION_FORBIDDEN).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    SellerActivationConflict:
      description: Perfil ya activado (SELLER_ALREADY_ACTIVE) o identificador ocupado (SELLER_SLUG_IN_USE).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    InvalidRequest:
      description: Datos inválidos (INVALID_REQUEST).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    EmailLinkAccepted:
      description: Aceptación genérica sin cuerpo para todo correo válido, incluido un correo desconocido o sujeto al límite.
    InvalidEmailLink:
      description: Datos inválidos (INVALID_REQUEST) o enlace vencido, consumido o de otra finalidad (INVALID_EMAIL_LINK).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    EmailLinkRateLimit:
      description: Límite de confirmaciones por IP (EMAIL_LINK_RATE_LIMIT).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    CsrfRejected:
      description: Origin o cabecera CSRF inválidos (CSRF_REJECTED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    GoogleUnavailable:
      description: Google está deshabilitado o el host no coincide con la URL configurada (GOOGLE_UNAVAILABLE).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
    InvalidSession:
      description: Bearer ausente, inválido, vencido o revocado (INVALID_SESSION).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemResponse'
  headers:
    GoogleBrowserCookie:
      description: Cookie de correlación HttpOnly, Secure y SameSite=Lax, con Path=/ y sin Domain.
      schema:
        type: string
    RefreshCookie:
      description: Cookie de renovación HttpOnly, Secure y SameSite=Strict, con Path=/, sin Domain y con vigencia máxima de 14 días. Max-Age=0 indica eliminación.
      schema:
        type: string
    TraceId:
      description: Identificador de correlación generado por el servidor.
      schema:
        type: string
        format: uuid
  schemas:
    QuoteRequest:
      type: object
      required: [addressId, cartVersion]
      properties:
        addressId: { type: string, format: uuid }
        cartVersion: { type: integer, format: int64, minimum: 0 }
    CheckoutConfirmRequest:
      type: object
      required: [quoteId]
      properties:
        quoteId: { type: string, format: uuid }
    QuoteResponse:
      type: object
      required: [id, expiresAt, serverNow, cartVersion, address, groups, total, currency]
      properties:
        id: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        serverNow: { type: string, format: date-time }
        cartVersion: { type: integer, format: int64, minimum: 0 }
        address:
          $ref: '#/components/schemas/AddressResponse'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutSellerGroup'
        total:
          $ref: '#/components/schemas/CartAmount'
        currency: { type: string, const: ARS }
    OrderResponse:
      type: object
      required: [id, expiresAt, serverNow, status, subOrders, total, currency]
      properties:
        id: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        serverNow: { type: string, format: date-time }
        status: { type: string, enum: [RESERVADA, PAGO_PENDIENTE, EXPIRADA] }
        subOrders:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutSubOrder'
        total:
          $ref: '#/components/schemas/CartAmount'
        currency: { type: string, const: ARS }
    OrderPage:
      type: object
      required: [content, page, size, hasNext]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 50 }
        hasNext: { type: boolean }
    OrderSummary:
      type: object
      required: [id, createdAt, expiresAt, status, total, currency]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [RESERVADA, PAGO_PENDIENTE, EXPIRADA] }
        total:
          $ref: '#/components/schemas/CartAmount'
        currency: { type: string, const: ARS }
    CheckoutSubOrder:
      type: object
      required: [id, status, address, group]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ESPERA_PAGO, CANCELADA] }
        address:
          $ref: '#/components/schemas/AddressResponse'
        group:
          $ref: '#/components/schemas/CheckoutSellerGroup'
    CheckoutSellerGroup:
      type: object
      required: [sellerId, sellerName, items, merchandise, shipping, commission, subtotal]
      properties:
        sellerId: { type: string, format: uuid }
        sellerName: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutLine'
        merchandise:
          $ref: '#/components/schemas/CartAmount'
        shipping:
          $ref: '#/components/schemas/CartAmount'
        commission:
          $ref: '#/components/schemas/CartAmount'
        subtotal:
          description: Mercadería más envío.
          $ref: '#/components/schemas/CartAmount'
    CheckoutLine:
      type: object
      required: [skuId, skuCode, title, attributes, quantity, unitPrice, subtotal, commissionBps, commission]
      properties:
        skuId: { type: string, format: uuid }
        skuCode: { type: string }
        title: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPrice:
          $ref: '#/components/schemas/CartAmount'
        subtotal:
          $ref: '#/components/schemas/CartAmount'
        commissionBps: { type: integer, minimum: 0, maximum: 10000 }
        commission:
          $ref: '#/components/schemas/CartAmount'
    CartItemRequest:
      type: object
      required: [quantity, expectedVersion]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    CartResponse:
      type: object
      required: [version, groups, unavailable, total, currency, itemCount, activeOrderId]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: Empieza en 0 y aumenta con cada edición persistida.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CartSellerGroup'
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          $ref: '#/components/schemas/CartAmount'
        currency: { type: string, const: ARS }
        activeOrderId:
          type: [string, 'null']
          format: uuid
          description: Orden activa que bloquea las líneas reservadas, cuando existe.
        itemCount:
          type: integer
          format: int64
          minimum: 0
          description: Total de unidades agregadas, incluidas las no disponibles.
    CartSellerGroup:
      type: object
      required: [sellerId, sellerSlug, sellerName, items, subtotal]
      properties:
        sellerId: { type: string, format: uuid }
        sellerSlug: { type: string }
        sellerName: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          $ref: '#/components/schemas/CartAmount'
    CartItem:
      type: object
      required: [skuId, listingSlug, title, attributes, quantity, availableStock, unitPrice, referencePrice, subtotal, reason, reserved]
      properties:
        skuId: { type: string, format: uuid }
        listingSlug: { type: [string, 'null'] }
        title: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        availableStock: { type: integer, minimum: 0 }
        unitPrice:
          description: Precio vigente para variantes públicas. Para variantes retiradas, último precio guardado.
          $ref: '#/components/schemas/CartAmount'
        referencePrice:
          description: Precio guardado al agregar o confirmar la cantidad.
          $ref: '#/components/schemas/CartAmount'
        subtotal:
          oneOf:
            - $ref: '#/components/schemas/CartAmount'
            - type: 'null'
        reason:
          type: [string, 'null']
          enum: [LISTING_UNAVAILABLE, SKU_UNAVAILABLE, INSUFFICIENT_STOCK, SELF_PURCHASE, null]
        reserved:
          type: boolean
          description: Una reserva propia bloquea la edición y remoción de la línea.
    CartAmount:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
    CategoryNode:
      type: object
      required: [category, children]
      properties:
        category: { $ref: '#/components/schemas/CategoryResponse' }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }
    ListingSearchPage:
      type: object
      required: [content, page, size, totalElements, totalPages, facets, sellers]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ListingCardResponse' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 48 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        facets:
          type: array
          maxItems: 40
          items:
            type: object
            required: [key, value, count]
            properties:
              key: { type: string }
              value: { type: string }
              count: { type: integer, minimum: 1 }
        sellers:
          type: array
          maxItems: 20
          items:
            type: object
            required: [slug, name, count]
            properties:
              slug: { type: string }
              name: { type: string }
              count: { type: integer, minimum: 1 }
    ListingCardResponse:
      type: object
      required: [id, slug, title, categoryId, seller, sellerName, thumbnailUrl, price, available]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        categoryId: { type: string, format: uuid }
        seller: { type: string }
        sellerName: { type: string }
        thumbnailUrl: { type: [string, 'null'] }
        price:
          type: string
          description: Precio decimal en ARS de la variante coincidente más económica, con prioridad a las disponibles.
          example: '150.00'
        available: { type: boolean }
    QuestionPage:
      type: object
      required: [content, page, hasNext]
      properties:
        content: { type: array }
        page: { type: integer, minimum: 0 }
        hasNext: { type: boolean }
    PublicQuestion:
      type: object
      required: [id, text, createdAt, answer, answeredAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        answer: { type: [string, 'null'], maxLength: 1000 }
        answeredAt: { type: [string, 'null'], format: date-time }
    PendingQuestion:
      type: object
      required: [id, text, createdAt, listingSlug, listingTitle]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        listingSlug: { type: string }
        listingTitle: { type: string }
    EmailLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    EmailLinkToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    EmailVerificationConfirmation:
      type: object
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/EmailLinkToken'
    PasswordResetConfirmation:
      type: object
      required: [token, password]
      properties:
        token:
          $ref: '#/components/schemas/EmailLinkToken'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: Admite hasta 72 bytes UTF-8.
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: Admite hasta 72 bytes UTF-8.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 72
    AccessTokenResponse:
      type: object
      required: [accessToken, expiresIn, roles]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          maximum: 600
          description: Tiempo de vigencia restante en segundos.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    AccountResponse:
      type: object
      required: [id, email, emailVerified, roles, displayName]
      properties:
        displayName:
          type: [string, 'null']
          maxLength: 80
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    ProfileUpdate:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    AddressRequest:
      type: object
      required: [street, city, provinceCode, postalCode, country]
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 140
        city:
          type: string
          minLength: 1
          maxLength: 80
        provinceCode:
          type: string
          pattern: '^AR-[ABCDEFGHJKLMNPQRSTUVWXYZ]$'
          description: Código ISO 3166-2 de provincia o CABA.
        postalCode:
          type: string
          pattern: '^([0-9]{4}|[A-Z][0-9]{4}[A-Z]{3})$'
        country:
          type: string
          const: AR
    AddressPatch:
      type: object
      properties:
        street:
          type: [string, 'null']
          minLength: 1
          maxLength: 140
        city:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
        provinceCode:
          type: [string, 'null']
          pattern: '^AR-[ABCDEFGHJKLMNPQRSTUVWXYZ]$'
          description: Código ISO 3166-2 de provincia o CABA.
        postalCode:
          type: [string, 'null']
          pattern: '^([0-9]{4}|[A-Z][0-9]{4}[A-Z]{3})$'
        country:
          type: [string, 'null']
          enum: [AR, null]
    AddressResponse:
      allOf:
        - $ref: '#/components/schemas/AddressRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    SellerType:
      type: string
      enum: [PERSONAL, COMERCIO]
    SellerActivationRequest:
      type: object
      required: [type, displayName, slug]
      properties:
        type:
          $ref: '#/components/schemas/SellerType'
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          description: Se quitan acentos y espacios externos y se normalizan mayúsculas y separadores. El resultado tiene 3 a 50 caracteres.
        bio:
          type: [string, 'null']
          maxLength: 500
    SellerProfileResponse:
      type: object
      required: [type, displayName, slug, bio, reviewCount, averageRating]
      properties:
        type:
          $ref: '#/components/schemas/SellerType'
        displayName:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        bio:
          type: string
        reviewCount:
          type: integer
          minimum: 0
        averageRating:
          type: [number, 'null']
          minimum: 1
          maximum: 5
    Role:
      type: string
      enum: [USER, SELLER, ADMIN]
    CategoryResponse:
      type: object
      required: [id, name, slug, parentId, attributeSchema]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        parentId:
          type: [string, 'null']
          format: uuid
        attributeSchema:
          type: object
          description: Atributos requeridos y valores enumerados para los SKU.
          additionalProperties:
            type: array
            items:
              type: string
          example: {color: [Negro, Azul], talle: [S, M, L]}
    PublicationRequest:
      type: object
      required: [categoryId, title, description, specs]
      properties:
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 5000
        specs:
          $ref: '#/components/schemas/ListingSpecs'
    PublicationPatch:
      type: object
      required: [expectedVersion]
      description: Los campos de ficha omitidos o nulos conservan sus valores. Si cambia la categoría, todos los SKU vigentes deben cumplir el nuevo esquema.
      properties:
        expectedVersion:
          $ref: '#/components/schemas/CatalogVersion'
        categoryId:
          type: [string, 'null']
          format: uuid
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 160
        description:
          type: [string, 'null']
          minLength: 1
          maxLength: 5000
        specs:
          anyOf:
            - $ref: '#/components/schemas/ListingSpecs'
            - type: 'null'
    ListingSpecs:
      type: object
      description: Especificaciones libres. El JSON compacto admite hasta 8 KiB UTF-8.
      example: {material: algodón}
    CatalogVersion:
      type: integer
      format: int64
      minimum: 0
      description: Versión del recurso editado. Empieza en cero.
    SkuRequest:
      type: object
      required: [code, attributes, price, initialStock]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
          description: Código global, inmutable y normalizado a mayúsculas.
        attributes:
          $ref: '#/components/schemas/SkuAttributes'
        price:
          $ref: '#/components/schemas/SkuPriceInput'
        initialStock:
          type: integer
          format: int32
          minimum: 0
    SkuPatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      description: Los atributos o el precio omitidos o nulos conservan su valor. Enviar atributos reemplaza la combinación completa.
      properties:
        expectedVersion:
          $ref: '#/components/schemas/CatalogVersion'
        attributes:
          anyOf:
            - $ref: '#/components/schemas/SkuAttributes'
            - type: 'null'
        price:
          anyOf:
            - $ref: '#/components/schemas/SkuPriceInput'
            - type: 'null'
    SkuAttributes:
      type: object
      maxProperties: 16
      additionalProperties:
        type: string
      description: Todos los atributos y valores enumerados por la categoría. El JSON compacto admite hasta 1 KiB UTF-8.
      example: {color: Negro, talle: M}
    SkuPriceInput:
      description: Importe positivo en ARS con hasta 17 dígitos enteros y 2 decimales.
      oneOf:
        - type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
        - type: string
          example: '12990.50'
    ListingSummary:
      allOf:
        - $ref: '#/components/schemas/ListingSummaryBase'
        - type: object
          required: [slug, thumbnailUrl, skus]
          properties:
            slug:
              type: [string, 'null']
            thumbnailUrl:
              type: [string, 'null']
              format: uri-reference
            skus:
              type: array
              items:
                $ref: '#/components/schemas/SkuResponse'
    ListingSummaryBase:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [BORRADOR, ACTIVA, ARCHIVADA]
    ListingResponse:
      allOf:
        - $ref: '#/components/schemas/ListingSummaryBase'
        - type: object
          required: [categoryId, description, specs, slug, version, skus, images]
          properties:
            categoryId:
              type: string
              format: uuid
            description:
              type: string
            specs:
              $ref: '#/components/schemas/ListingSpecs'
            version:
              $ref: '#/components/schemas/CatalogVersion'
            slug:
              type: [string, 'null']
            skus:
              type: array
              items:
                $ref: '#/components/schemas/SkuResponse'
            images:
              type: array
              items:
                $ref: '#/components/schemas/ListingImageResponse'
    SkuResponse:
      type: object
      required: [id, code, attributes, price, availableStock, version]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        attributes:
          $ref: '#/components/schemas/SkuAttributes'
        price:
          type: string
          pattern: '^[0-9]{1,17}\.[0-9]{2}$'
          description: Decimal exacto en ARS.
          example: '12990.50'
        availableStock:
          type: integer
          format: int32
          minimum: 0
        version:
          $ref: '#/components/schemas/CatalogVersion'
    ListingImageUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG o WebP decodificable. Hasta 5 MiB, 12 megapíxeles y 8192 píxeles por lado.
        alt:
          type: string
          maxLength: 160
          description: Texto alternativo opcional.
    ListingImagePatch:
      type: object
      properties:
        alt:
          type: [string, 'null']
          maxLength: 160
        position:
          type: [integer, 'null']
          minimum: 0
          maximum: 5
          description: Posición a partir de cero en la galería actual. La API reordena las demás imágenes.
    ListingImageResponse:
      type: object
      required: [id, url, thumbnailUrl, alt, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri-reference
        thumbnailUrl:
          type: string
          format: uri-reference
        alt:
          type: string
        position:
          type: integer
          minimum: 0
          maximum: 5
    PublicSku:
      type: object
      required: [id, attributes, price, available]
      properties:
        id:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/SkuAttributes'
        price:
          type: string
          pattern: '^[0-9]{1,17}\.[0-9]{2}$'
          description: Decimal exacto en ARS.
        available:
          type: boolean
          description: Indica si el stock disponible es mayor que cero.
    ListingDetailResponse:
      type: object
      required: [id, slug, title, description, specs, category, seller, images, skus]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        specs:
          $ref: '#/components/schemas/ListingSpecs'
        category:
          $ref: '#/components/schemas/CategoryResponse'
        seller:
          $ref: '#/components/schemas/SellerProfileResponse'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ListingImageResponse'
        skus:
          type: array
          items:
            $ref: '#/components/schemas/PublicSku'
    StockAdjustmentRequest:
      type: object
      required: [delta, reason, expectedVersion]
      properties:
        delta:
          type: integer
          format: int32
          not:
            const: 0
          example: -2
        reason:
          type: string
          minLength: 1
          maxLength: 240
        expectedVersion:
          $ref: '#/components/schemas/CatalogVersion'
    StockMovement:
      type: object
      required: [id, skuId, actorId, traceId, delta, reason, beforeStock, afterStock, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        traceId:
          type: string
          format: uuid
          description: Correlación de la solicitud original.
        delta:
          type: integer
          format: int32
        reason:
          type: string
        beforeStock:
          type: integer
          format: int32
          minimum: 0
        afterStock:
          type: integer
          format: int32
          minimum: 0
        version:
          $ref: '#/components/schemas/CatalogVersion'
        createdAt:
          type: string
          format: date-time
    StockMovementPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
    ProblemResponse:
      type: object
      required: [type, title, status, detail, instance, code, traceId, errors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
