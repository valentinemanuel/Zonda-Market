services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zonda_market}
      POSTGRES_USER: ${POSTGRES_USER:-zonda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=25
    mem_limit: 256m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zonda_market}?connectTimeout=2&socketTimeout=3
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
      DEMO_SEED_ADMIN_PASSWORD: ${DEMO_SEED_ADMIN_PASSWORD:-}
      DB_USER: ${POSTGRES_USER:-zonda}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      AUTH_JWT_KEY: ${AUTH_JWT_KEY:?Definí AUTH_JWT_KEY en .env}
      MERCADO_PAGO_TEST_ENABLED: ${MERCADO_PAGO_TEST_ENABLED:-false}
      MERCADO_PAGO_PUBLIC_KEY: ${MERCADO_PAGO_PUBLIC_KEY:-}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_TEST_COLLECTOR_ID: ${MERCADO_PAGO_TEST_COLLECTOR_ID:-0}
      MERCADO_PAGO_CARD_WEBHOOK_SECRET: ${MERCADO_PAGO_CARD_WEBHOOK_SECRET:-}
      MERCADO_PAGO_PRO_WEBHOOK_SECRET: ${MERCADO_PAGO_PRO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_PRO_TEST_ENABLED: ${MERCADO_PAGO_PRO_TEST_ENABLED:-false}
      MERCADO_PAGO_PRO_ACCESS_TOKEN: ${MERCADO_PAGO_PRO_ACCESS_TOKEN:-}
      MERCADO_PAGO_PRO_TEST_COLLECTOR_ID: ${MERCADO_PAGO_PRO_TEST_COLLECTOR_ID:-0}
      MERCADO_PAGO_PRO_PUBLIC_ORIGIN: ${MERCADO_PAGO_PRO_PUBLIC_ORIGIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:${WEB_PORT:-3000}/login/oauth2/code/google}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mailpit}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-avisos@zonda.test}
      MAIL_PUBLIC_ORIGIN: ${MAIL_PUBLIC_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
      MAILPIT_URL: http://mailpit:8025
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: -Xmx384m
      PORT: "8080"
    mem_limit: 768m
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/estado"]
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  postgres-data:
