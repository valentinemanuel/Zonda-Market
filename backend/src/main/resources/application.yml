server:
  port: ${PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

zonda:
  auth:
    jwt-key: ${AUTH_JWT_KEY}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  mail:
    provider: ${MAIL_PROVIDER:mailpit}
    public-origin: ${MAIL_PUBLIC_ORIGIN:http://localhost:3000}
    from: ${MAIL_FROM:avisos@zonda.test}
    mailpit-url: ${MAILPIT_URL:http://localhost:8025}
    resend-api-key: ${RESEND_API_KEY:}
  media:
    provider: ${MEDIA_PROVIDER:disabled}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/login/oauth2/code/google}
    issuer: https://accounts.google.com
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: zonda-market
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 2000
      validation-timeout: 1000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [traceId:%X{traceId}]"
