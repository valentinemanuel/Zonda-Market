name: Verificación de Zonda Market
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compilar y probar el contrato con PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: zonda-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: smoke-zonda-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verificar demo estática sin API
        working-directory: frontend
        run: npm run test:portfolio
      - name: Levantar aplicación
        run: |
          printf 'AUTH_JWT_KEY=%s\n' "$(openssl rand -base64 32)" > .env
          docker compose up --build --wait --wait-timeout 90
      - name: Ejecutar regresión Playwright
        working-directory: frontend
        run: npm run test:e2e
      - name: Adjuntar evidencia
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencia-smoke
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Mostrar servicios si falla el smoke
        if: failure()
        run: docker compose ps -a
      - name: Detener aplicación
        if: always()
        run: docker compose down --volumes
